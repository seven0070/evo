name: Evo production gate

on:
  pull_request:
  push:
    branches:
      - main
      - "v*"

permissions:
  contents: read

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sandbox isolation utility
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap util-linux
          # GitHub-hosted runners restrict unprivileged uid-map writes. Use the
          # distro-trusted bwrap helper mode on this ephemeral runner so Evo can
          # retain user, network, PID, and mount isolation instead of weakening it.
          sudo chmod 4755 "$(command -v bwrap)"
          stat -c '%A %a %n' "$(command -v bwrap)"
      - name: Install development package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run production gate
        run: python scripts/run_production_gate.py
