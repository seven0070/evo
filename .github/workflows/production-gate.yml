name: Evo production gate

on:
  pull_request:
  push:
    branches:
      - main
      - "v*"

permissions:
  contents: read

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run production gate
        run: python scripts/run_production_gate.py
