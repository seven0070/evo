name: Evo Windows qualification

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: evo-windows-qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Verify Windows runner and WebView2 preconditions
        run: |
          $ErrorActionPreference = "Stop"
          $os = Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber, OsArchitecture
          $os | Format-List | Tee-Object "$env:RUNNER_TEMP\evo-windows-preconditions.txt"
          if ($os.WindowsProductName -notlike "*Windows 11*") {
            Write-Warning "GitHub-hosted runner is $($os.WindowsProductName), not Windows 11. Continuing with Windows-hosted packaging/install smoke tests only; Windows 11 pilot acceptance remains external-device work."
            "Windows11Qualification=BLOCKED — EXTERNAL DEVICE REQUIRED" | Add-Content "$env:RUNNER_TEMP\evo-windows-preconditions.txt"
          } else {
            "Windows11Qualification=runner-confirmed" | Add-Content "$env:RUNNER_TEMP\evo-windows-preconditions.txt"
          }
          $webView2Roots = @(
            (Join-Path ${env:ProgramFiles(x86)} "Microsoft\EdgeWebView\Application"),
            (Join-Path ${env:ProgramFiles} "Microsoft\EdgeWebView\Application")
          )
          $webView2Root = $webView2Roots | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $webView2Root) { throw "WebView2 runtime was not found on the Windows runner" }
          "WebView2Root=$webView2Root" | Tee-Object "$env:RUNNER_TEMP\evo-webview2.txt"
          Get-ChildItem $webView2Root -Directory | Select-Object Name, FullName | Out-File "$env:RUNNER_TEMP\evo-webview2-versions.txt"

      - name: Build Windows installers
        continue-on-error: false
        run: ./scripts/build_windows.ps1

      - name: Verify build manifest and signatures
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = Join-Path $env:GITHUB_WORKSPACE "desktop/src-tauri/target/release/bundle"
          $nsis = Get-ChildItem (Join-Path $bundle "nsis/*.exe") -File | Select-Object -First 1
          $msi = Get-ChildItem (Join-Path $bundle "msi/*.msi") -File | Select-Object -First 1
          $manifestPath = Join-Path $bundle "release-manifest.json"
          if (-not $nsis) { throw "NSIS installer was not produced" }
          if (-not $msi) { throw "MSI installer was not produced" }
          if (-not (Test-Path $manifestPath)) { throw "release-manifest.json was not produced" }
          $evidence = Join-Path $env:RUNNER_TEMP "evo-windows-qualification"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          Get-FileHash $nsis.FullName -Algorithm SHA256 | Format-List | Out-File (Join-Path $evidence "nsis-hash.txt")
          Get-FileHash $msi.FullName -Algorithm SHA256 | Format-List | Out-File (Join-Path $evidence "msi-hash.txt")
          Get-AuthenticodeSignature $nsis.FullName | Format-List * | Out-File (Join-Path $evidence "nsis-authenticode.txt")
          Get-AuthenticodeSignature $msi.FullName | Format-List * | Out-File (Join-Path $evidence "msi-authenticode.txt")
          Copy-Item $manifestPath (Join-Path $evidence "release-manifest.json")
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.commit -ne (git rev-parse HEAD)) { throw "Manifest commit does not match checked-out commit" }
          foreach ($artifact in $manifest.artifacts) {
            $artifactPath = Join-Path $env:GITHUB_WORKSPACE ($artifact.path -replace '\\','/')
            if (-not (Test-Path $artifactPath)) { throw "Manifest artifact missing: $($artifact.path)" }
            $actual = Get-FileHash $artifactPath -Algorithm SHA256
            if ($actual.Hash.ToLowerInvariant() -ne $artifact.sha256) { throw "Manifest hash mismatch for $($artifact.name)" }
            if ((Get-Item $artifactPath).Length -ne [int64]$artifact.bytes) { throw "Manifest size mismatch for $($artifact.name)" }
          }

      - name: Run silent NSIS install, packaged bridge smoke test, launch, and uninstall
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = Join-Path $env:GITHUB_WORKSPACE "desktop/src-tauri/target/release/bundle"
          $nsis = Get-ChildItem (Join-Path $bundle "nsis/*.exe") -File | Select-Object -First 1
          $evidence = Join-Path $env:RUNNER_TEMP "evo-windows-qualification"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $installRoot = Join-Path $env:LOCALAPPDATA "Evo"
          Write-Host "[qualification] bundle=$bundle"
          Write-Host "[qualification] installer=$($nsis.FullName)"
          Write-Host "[qualification] installRoot=$installRoot"
          Write-Host "[qualification] evidence=$evidence"
          if (Test-Path $installRoot) { throw "Pre-existing install root found: $installRoot" }

          Write-Host "[qualification] Starting silent NSIS install with /S and waiting for completion"
          $installer = Start-Process -FilePath $nsis.FullName -ArgumentList "/S" -Wait -PassThru
          Write-Host "[qualification] installer exit code=$($installer.ExitCode)"
          if ($installer.ExitCode -ne 0) { throw "NSIS silent install failed with exit code $($installer.ExitCode)" }
          Write-Host "[qualification] Waiting 10 seconds for installer file operations to settle"
          Start-Sleep -Seconds 10
          Write-Host "[qualification] installRoot exists=$(Test-Path $installRoot)"
          if (-not (Test-Path $installRoot)) { throw "Expected per-user install root was not created: $installRoot" }
          Get-ChildItem $installRoot -Recurse -Force | Select-Object FullName, Length | Out-File (Join-Path $evidence "installed-files.txt")

          $bridge = Get-ChildItem $installRoot -Recurse -Filter "evo-bridge.exe" -File | Select-Object -First 1
          Write-Host "[qualification] bridge=$($bridge.FullName)"
          if (-not $bridge) { throw "Packaged evo-bridge.exe was not found below $installRoot" }
          Write-Host "[qualification] bridge exists=$(Test-Path $bridge.FullName)"
          $workspace = Join-Path $env:RUNNER_TEMP "evo-windows-qualification-workspace"
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null
          Write-Host "[qualification] bridge workspace=$workspace"

          # Evo intentionally uses JSONL over a short-lived local process rather than
          # a localhost server or loopback listener. Retry the exact shipped bridge
          # contract without adding network authority to the application.
          $bridgeAttempts = 3
          $bridgePassed = $false
          $bridgeFailures = @()
          for ($attempt = 1; $attempt -le $bridgeAttempts; $attempt++) {
            $stdout = ""
            $stderr = ""
            $process = $null
            try {
              Write-Host "[qualification] bridge attempt $attempt/$bridgeAttempts"
              $psi = [System.Diagnostics.ProcessStartInfo]::new()
              $psi.FileName = $bridge.FullName
              $psi.Arguments = '--workspace "' + $workspace + '"'
              $psi.UseShellExecute = $false
              $psi.CreateNoWindow = $true
              $psi.RedirectStandardInput = $true
              $psi.RedirectStandardOutput = $true
              $psi.RedirectStandardError = $true
              $process = [System.Diagnostics.Process]::new()
              $process.StartInfo = $psi
              if (-not $process.Start()) { throw "Could not start packaged bridge" }
              Write-Host "[qualification] bridge process started pid=$($process.Id)"
              $process.StandardInput.WriteLine('{"command":"get_status"}')
              $process.StandardInput.WriteLine('{"command":"submit_goal","goal":"list files in the workspace"}')
              $process.StandardInput.WriteLine('{"command":"run_cycle"}')
              $process.StandardInput.Close()
              $stdout = $process.StandardOutput.ReadToEnd()
              $stderr = $process.StandardError.ReadToEnd()
              $process.WaitForExit()
              Write-Host "[qualification] bridge exit code=$($process.ExitCode)"
              Write-Host "[qualification] bridge stdout length=$($stdout.Length), stderr length=$($stderr.Length)"
              $stdout | Out-File (Join-Path $evidence "bridge-stdout-attempt-$attempt.jsonl")
              $stderr | Out-File (Join-Path $evidence "bridge-stderr-attempt-$attempt.txt")
              if ($process.ExitCode -ne 0) { throw "Packaged bridge exited with code $($process.ExitCode)" }
              $responses = @($stdout.Trim().Split([Environment]::NewLine) | Where-Object { $_ } | ForEach-Object { $_ | ConvertFrom-Json })
              if ($responses.Count -lt 3) { throw "Packaged bridge returned fewer than three JSONL responses: $stdout" }
              if ($responses | Where-Object { -not $_.ok }) { throw "Packaged bridge returned an error: $stdout" }
              $sqlitePath = Join-Path $workspace ".evo/agent.sqlite3"
              Write-Host "[qualification] authoritative SQLite path=$sqlitePath exists=$(Test-Path $sqlitePath)"
              if (-not (Test-Path $sqlitePath)) { throw "Bridge did not persist authoritative SQLite state after a submitted harmless goal" }
              $stdout | Out-File (Join-Path $evidence "bridge-stdout.jsonl")
              $stderr | Out-File (Join-Path $evidence "bridge-stderr.txt")
              $bridgePassed = $true
              Write-Host "[qualification] bridge attempt $attempt passed"
              break
            } catch {
              $failure = "attempt $attempt failed: $($_.Exception.Message)"
              $bridgeFailures += $failure
              Write-Host "[qualification] $failure"
              if ($attempt -lt $bridgeAttempts) {
                Write-Host "[qualification] retrying packaged bridge in 5 seconds"
                Start-Sleep -Seconds 5
              }
            } finally {
              if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
              if ($process) { $process.Dispose() }
            }
          }
          if (-not $bridgePassed) {
            $bridgeFailures | Out-File (Join-Path $evidence "bridge-failures.txt")
            throw "Packaged bridge smoke test failed after $bridgeAttempts attempts: $($bridgeFailures -join '; ')"
          }
          $appDataRoot = Join-Path $env:APPDATA "im.evo.personal"
          Write-Host "[qualification] app-data root=$appDataRoot exists=$(Test-Path $appDataRoot)"
          Get-ChildItem $appDataRoot -Recurse -Force -ErrorAction SilentlyContinue | Select-Object FullName, Length | Out-File (Join-Path $evidence "appdata-files.txt")
          $app = Get-ChildItem $installRoot -Recurse -Filter "*.exe" -File | Where-Object { $_.Name -notin @("evo-bridge.exe", "uninstall.exe") } | Select-Object -First 1
          Write-Host "[qualification] application candidate=$($app.FullName)"
          if (-not $app) { throw "Packaged Evo application executable was not found below $installRoot" }
          "Application=$($app.FullName)" | Out-File (Join-Path $evidence "application-path.txt")
          Write-Host "[qualification] launching packaged desktop executable"
          $desktop = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 5
          Write-Host "[qualification] desktop pid=$($desktop.Id), exited=$($desktop.HasExited), exit code=$($desktop.ExitCode)"
          if ($desktop.HasExited) { throw "Packaged Evo desktop process exited immediately with code $($desktop.ExitCode)" }
          "Evo process started: PID $($desktop.Id)" | Out-File (Join-Path $evidence "launch.txt")
          Stop-Process -Id $desktop.Id -Force -ErrorAction SilentlyContinue

          $uninstaller = Get-ChildItem $installRoot -Recurse -Filter "uninstall.exe" -File | Select-Object -First 1
          Write-Host "[qualification] uninstaller=$($uninstaller.FullName)"
          if (-not $uninstaller) { throw "NSIS uninstaller was not found" }
          Write-Host "[qualification] Starting silent uninstall with /S and waiting for completion"
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -Wait -PassThru
          Write-Host "[qualification] uninstaller exit code=$($uninstall.ExitCode)"
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall failed with exit code $($uninstall.ExitCode)" }
          Start-Sleep -Seconds 3
          Write-Host "[qualification] installRoot exists after uninstall=$(Test-Path $installRoot)"
          if (Test-Path $installRoot) { throw "Runtime files remain after uninstall: $installRoot" }
          "Install root removed: $installRoot" | Out-File (Join-Path $evidence "uninstall.txt")

      - name: Collect Windows qualification diagnostics on failure
        if: failure()
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          $evidence = Join-Path $env:RUNNER_TEMP "evo-windows-qualification"
          $installRoot = Join-Path $env:LOCALAPPDATA "Evo"
          Write-Host "[diagnostics] runner=$env:RUNNER_OS computer=$env:COMPUTERNAME"
          Write-Host "[diagnostics] installRoot=$installRoot exists=$(Test-Path $installRoot)"
          if (Test-Path $installRoot) { Get-ChildItem $installRoot -Recurse -Force | Select-Object FullName, Length | Format-Table -AutoSize }
          Write-Host "[diagnostics] matching Evo processes"
          Get-Process | Where-Object { $_.ProcessName -match "evo|WebView|msiexec" } | Select-Object Id, ProcessName, Path | Format-Table -AutoSize
          Get-ChildItem $env:LOCALAPPDATA -Directory -Force | Where-Object { $_.Name -match "Evo|Programs" } | Select-Object FullName | Out-File (Join-Path $evidence "failure-localappdata-directories.txt")
          Get-ChildItem $env:APPDATA -Directory -Force | Where-Object { $_.Name -match "Evo|im\.evo" } | Select-Object FullName | Out-File (Join-Path $evidence "failure-appdata-directories.txt")

      - name: Upload Windows qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evo-windows-qualification-${{ github.run_id }}
          path: ${{ runner.temp }}/evo-windows-qualification
          if-no-files-found: warn
