[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evo-agent"
version = "1.0.0"
description = "A local-first, permissioned, provider-neutral AI agent kernel."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.50.0"]
dev = ["pytest>=8.0"]

[project.scripts]
evo = "evo_agent.cli:main"

[tool.setuptools.packages.find]
include = ["evo_agent*"]

[tool.setuptools.package-data]
# The sovereign manifest must ship inside the wheel: startup verification protects the
# installed package, not the git checkout.
"evo_agent.sovereign" = ["sovereign.manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The xfail ledger is a ratchet: a defect that stops failing must fail the run until the
# marker is removed in review, so "we fixed it" and "we deleted the test" cannot look alike.
xfail_strict = true
